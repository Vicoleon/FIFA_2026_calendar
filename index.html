<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiniela Mundial 2026 — Pronostica, compite y gana con tus amigos</title>
  <meta name="description" content="Quiniela del Mundial FIFA 2026: pronostica los marcadores, compite en grupos con tus amigos, sube en la tabla de posiciones. Calendario completo, resultados en vivo, pronósticos y estadísticas." />
  <meta property="og:title" content="Quiniela Mundial 2026" />
  <meta property="og:description" content="Pronostica los marcadores del Mundial 2026 y compite con tus amigos. Crea tu grupo, invita y sube en la tabla." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;800&family=Poppins:wght@500;700;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <!-- aplica el tema guardado antes de pintar (evita parpadeo) -->
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('wc-theme')||'neon';}catch(e){document.documentElement.dataset.theme='neon';}</script>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <aside id="theme-dock" aria-label="Tema visual">
    <div class="td-title">🎨 Tema</div>
    <button class="td-opt" data-theme-id="neon"><span class="td-sw sw-neon"></span>Neón</button>
    <button class="td-opt" data-theme-id="fiesta"><span class="td-sw sw-fiesta"></span>Fiesta</button>
    <button class="td-opt" data-theme-id="editorial"><span class="td-sw sw-editorial"></span>Editorial</button>
  </aside>

  <header class="topbar">
    <div class="brand">
      <span class="ball">⚽</span>
      <div>
        <h1>Quiniela 2026</h1>
        <small>Canadá · México · Estados Unidos</small>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-view="grupos">Grupos</button>
      <button class="tab" data-view="eliminatorias">Eliminatorias</button>
      <button class="tab" data-view="calendario">Calendario</button>
      <button class="tab" data-view="miquiniela" data-auth>📝 Mi Quiniela</button>
      <button class="tab" data-view="tabla" data-auth>🏆 Tabla</button>
      <button class="tab" data-view="misgrupos" data-auth>👥 Mis grupos</button>
    </nav>
    <div class="tools">
      <button id="btn-today" class="btn btn-ghost" hidden title="Mostrar solo los partidos de hoy">📅 Hoy</button>
      <button id="btn-pred" class="btn btn-ghost" title="Mostrar/ocultar pronósticos">🔮</button>
      <button id="btn-project" class="btn btn-ghost" title="Proyectar la llave con los favoritos (por rating Elo)">📐 Proyectar</button>
      <button id="btn-recalc" class="btn btn-ghost" hidden title="Recalcular y guardar pronósticos">♻️</button>
      <span id="q-auth" class="auth-area"></span>
    </div>
  </header>

  <div id="q-reminder" class="reminder-slot"></div>

  <main id="content" class="content"><p class="loading">Cargando datos…</p></main>

  <footer class="foot">
    <p class="foot-credit">
      Desarrollado por <a href="https://www.rubik-soft.com" target="_blank" rel="noopener">www.rubik-soft.com</a>
    </p>
    <p class="foot-sub">Datos en vivo vía Supabase · Pronóstico Elo + Poisson · Cuadro según el sorteo oficial.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/predictor.js"></script>
  <script src="assets/js/standings.js"></script>
  <script src="assets/js/analytics.js"></script>
  <script src="assets/js/app.js"></script>
  <script type="module" src="assets/js/quiniela.js"></script>
</body>
</html>
